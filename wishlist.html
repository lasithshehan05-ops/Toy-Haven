<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Toy Haven Hot Wheels style diecast car collection">
  <title>Collection | Toy Haven</title>
  <link rel="icon" href="images/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container navbar">
    <a class="logo" href="index.html">TOY HAVEN</a>
    <button class="menu-button" id="menuButton" aria-label="Open menu">☰</button>
    <nav aria-label="Main navigation">
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Cars</a></li>
        <li><a href="cart.html">Cart (<span id="cartCount">0</span>)</a></li>
        <li><a href="wishlist.html">Collection</a></li>
        <li><a href="checkout.html">Checkout</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>
    </nav>
  </div>
</header>
<main>

<section class="section">
  <div class="container">
    <h1>My Collection</h1>
    <p>Save cars and mark them as Interested, Owned or Not Interested.</p>
    <div id="wishlistGrid" class="cards"></div>
  </div>
</section>

</main>
<footer>
  <div class="container footer-grid">
    <div>
      <h3>Toy Haven</h3>
      <p>A simple online collection of Hot Wheels style diecast cars.</p>
      <p>© <span id="year"></span> Toy Haven</p>
    </div>
    <div>
      <h3>Pages</h3>
      <p><a href="products.html">Cars</a></p>
      <p><a href="wishlist.html">Collection</a></p>
      <p><a href="support.html">Support</a></p>
    </div>
    <div>
      <h3>Newsletter</h3>
      <form id="newsletterForm">
        <label for="newsletterEmail">Email</label>
        <input id="newsletterEmail" type="email" required placeholder="you@example.com">
        <br><br>
        <button class="button yellow" type="submit">Subscribe</button>
      </form>
      <p id="newsletterMessage"></p>
    </div>
  </div>
</footer>
<script src="script.js"></script>
<script>

const wishlistGrid = document.getElementById("wishlistGrid");

function showWishlist() {
  const list = JSON.parse(localStorage.getItem("toyHavenWishlist")) || [];
  wishlistGrid.innerHTML = "";

  if (list.length === 0) {
    wishlistGrid.innerHTML = "<p>Your collection is empty. Add a car from the Cars page.</p>";
    return;
  }

  list.forEach(item => {
    const product = getProduct(item.id);
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <img class="product-image" src="${product.image}" alt="${product.name}">
      <div class="card-body">
        <h3>${product.name}</h3>
        <p>${product.description}</p>
        <p>Current status: <strong>${item.status}</strong></p>
        <div class="status-buttons">
          <button onclick="setStatus(${product.id}, 'Interested')">Interested</button>
          <button onclick="setStatus(${product.id}, 'Owned')">Owned</button>
          <button onclick="setStatus(${product.id}, 'Not Interested')">Not Interested</button>
        </div>
        <br>
        <button class="button secondary" onclick="removeWishlist(${product.id})">Remove</button>
      </div>
    `;
    wishlistGrid.appendChild(card);
  });
}

function setStatus(id, status) {
  const list = JSON.parse(localStorage.getItem("toyHavenWishlist")) || [];
  const item = list.find(product => product.id === id);

  if (item) {
    item.status = status;
    localStorage.setItem("toyHavenWishlist", JSON.stringify(list));
    showWishlist();
  }
}

function removeWishlist(id) {
  const list = JSON.parse(localStorage.getItem("toyHavenWishlist")) || [];
  const newList = list.filter(item => item.id !== id);
  localStorage.setItem("toyHavenWishlist", JSON.stringify(newList));
  showWishlist();
}

showWishlist();

</script>
</body>
</html>
